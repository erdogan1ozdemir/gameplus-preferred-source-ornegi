<style>
.gpps{--gpps-bg:#0D0D0D;--gpps-line:#29292B;--gpps-ink:#FFFFFF;--gpps-sub:#B2B2B2;--gpps-accent:#FFC900;display:flex;flex-wrap:wrap;align-items:center;gap:20px;margin:32px 0;padding:20px 24px;background:var(--gpps-bg);border:1px solid var(--gpps-line);border-radius:12px;font-family:GreycliffCF,-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;color:var(--gpps-ink);box-sizing:border-box}
.gpps *{box-sizing:border-box}
.gpps .gpps__mark{flex:0 0 auto;display:flex;align-items:center}

.gpps .gpps__copy{flex:1 1 240px;min-width:0}
.gpps strong.gpps__ttl{display:block;font-family:"New Science",GreycliffCF,-apple-system,system-ui,sans-serif;font-size:20px;line-height:28px;font-weight:600;color:var(--gpps-ink);letter-spacing:-.01em}
.gpps span.gpps__sub{display:block;margin-top:6px;font-size:16px;line-height:24px;color:var(--gpps-sub)}
.gpps .gpps__act{flex:0 0 auto;margin-left:auto;display:flex;align-items:center;min-height:44px}
.gpps a.gpps__btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:11px 20px;border:1px solid var(--gpps-accent);border-radius:8px;background:transparent;color:var(--gpps-accent);font-family:inherit;font-size:16px;line-height:20px;font-weight:700;text-decoration:none;white-space:nowrap;transition:background-color .2s ease}
.gpps a.gpps__btn:hover{background:rgba(255,201,0,0.12)}
.gpps a.gpps__btn .gpps__g{flex:0 0 auto;display:block}
.gpps a.gpps__btn:focus-visible{outline:2px solid var(--gpps-accent);outline-offset:3px}
@media (max-width:640px){.gpps{gap:14px;padding:18px;align-items:flex-start}.gpps .gpps__mark{padding-top:2px}.gpps .gpps__mark svg{width:72px}.gpps strong.gpps__ttl{font-size:18px;line-height:26px}.gpps .gpps__act{margin-left:0;width:100%}.gpps a.gpps__btn{width:100%}
}
@media (prefers-reduced-motion:reduce){
.gpps a.gpps__btn{transition:none}
}
